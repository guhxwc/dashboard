<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitMind Dashboard - Gestão e Métricas</title>
    <meta name="description" content="Painel administrativo do FitMind para acompanhamento de MRR, Churn, CAC, LTV, gestão de afiliados, análise de consultorias e divisão de lucros." />
    <meta name="keywords" content="FitMind, Dashboard, Nutrição, MRR, Assinaturas, Consultoria, Afiliados" />
    <meta name="author" content="FitMind" />
    <meta property="og:title" content="FitMind Dashboard" />
    <meta property="og:description" content="Painel administrativo e métricas FitMind." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
